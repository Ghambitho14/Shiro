# Arma la imagen Docker de Aku y la publica en ghcr.io/ghambitho14/aku.
# Corre sola al publicar una versión (etiqueta v*, la crea `npm run publicar`), al subir cambios
# a main o a la rama de trabajo, y a mano desde la pestaña Actions («Run workflow», solo desde main).
# En el servidor se instala y actualiza con deploy/docker-compose.yml (ver DEPLOY.md).
name: Imagen Docker

on:
  push:
    tags: ["v*"]
    branches: [main, feat/preguntar-y-dibujar]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ghambitho14/aku:latest
            ghcr.io/ghambitho14/aku:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Aku
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
