# Shiro — servidor web en Docker
# Uso: docker compose up -d --build
# Web: http://<servidor>:1406 (pide la contraseña SHIRO_AUTH_TOKEN del archivo .env)

services:
  shiro:
    build: .
    image: shiro:latest
    container_name: shiro
    ports:
      - "1406:1406"
    # Claves y contraseña (SHIRO_AUTH_TOKEN, OPENROUTER_API_KEY...): en .env, junto a este archivo.
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=1406
      - BIND_HOST=0.0.0.0
    extra_hosts:
      # Para llegar a Ollama/LM Studio del propio servidor: http://host.docker.internal:11434
      - "host.docker.internal:host-gateway"
    volumes:
      # Base de datos y ajustes de Shiro (config.json, chat-index.sqlite, chats/, workspace/, sesión de WhatsApp)
      - ./data:/app/data
    restart: unless-stopped
