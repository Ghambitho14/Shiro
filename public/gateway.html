<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiro Gateway Console</title>
    <style>
        :root {
            --bg: #0b1020;
            --bg-soft: #111832;
            --bg-card: #121b33;
            --border: #25345b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 14px 30px rgba(2, 8, 23, 0.35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background:
                radial-gradient(900px 500px at -10% -20%, rgba(99, 102, 241, 0.18), transparent 60%),
                radial-gradient(700px 400px at 120% -10%, rgba(59, 130, 246, 0.12), transparent 60%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }
        h1 { color: var(--text); margin-bottom: 16px; letter-spacing: -0.02em; }
        .container { max-width: 980px; margin: 0 auto; }
        
        .status-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .status-item {
            background: var(--bg-soft);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .status-item .value {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
        }
        
        .status-item .label {
            font-size: 12px;
            color: var(--muted);
            margin-top: 5px;
        }
        
        .clients-list {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        
        .client-item {
            background: var(--bg-soft);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .client-info { font-size: 14px; }
        .client-info .id { color: var(--accent); }
        .client-info .session { color: var(--muted); font-size: 12px; }
        
        .connected { color: var(--success); }
        .disconnected { color: var(--danger); }
        
        .log-container {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        
        .log-entry {
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 8px;
            font-family: ui-monospace, "JetBrains Mono", monospace;
            font-size: 13px;
        }
        
        .log-entry.received { background: #162747; border-left: 3px solid #3b82f6; }
        .log-entry.sent { background: #1f2c46; border-left: 3px solid var(--accent); }
        .log-entry.system { background: #1e1f3f; border-left: 3px solid #a855f7; }
        
        .log-entry .time { color: #64748b; margin-right: 10px; }
        .log-entry .type { color: #93c5fd; margin-right: 10px; }
        
        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }
        
        button:hover { filter: brightness(1.08); }
        button.disconnect { background: var(--danger); }
        button.disconnect:hover { filter: brightness(1.06); }
        
        .controls { margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shiro Gateway Console</h1>
        
        <div class="status-card">
            <h2>Estado</h2>
            <div class="status-grid">
                <div class="status-item">
                    <div class="value" id="status">Conectando...</div>
                    <div class="label">Conexión</div>
                </div>
                <div class="status-item">
                    <div class="value" id="clients">0</div>
                    <div class="label">Clientes</div>
                </div>
                <div class="status-item">
                    <div class="value" id="sessions">0</div>
                    <div class="label">Sesiones</div>
                </div>
                <div class="status-item">
                    <div class="value" id="uptime">0s</div>
                    <div class="label">Uptime</div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="connectBtn" onclick="connect()">Conectar</button>
            <button class="disconnect" id="disconnectBtn" onclick="disconnect()" disabled>Desconectar</button>
            <button onclick="sendPing()">Ping</button>
        </div>
        
        <div class="log-container" id="log">
            <div class="log-entry system">
                <span class="time">[Sistema]</span>
                Conectando al Gateway...
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let clientId = null;
        
        function connect() {
            // Conectar al mismo host y puerto, pero con /ws
            const wsUrl = `ws://${window.location.host}/ws`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                addLog('system', 'Conectado al Gateway');
                document.getElementById('status').innerHTML = '<span class="connected">Conectado</span>';
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
            };
            
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleMessage(msg);
                } catch (e) {
                    addLog('received', event.data);
                }
            };
            
            ws.onclose = () => {
                addLog('system', 'Desconectado del Gateway');
                document.getElementById('status').innerHTML = '<span class="disconnected">Desconectado</span>';
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
            };
            
            ws.onerror = (error) => {
                addLog('system', 'Error de conexión');
            };
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
            }
        }
        
        function sendPing() {
            send({ type: 'ping', payload: {} });
        }
        
        function send(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(msg));
                addLog('sent', msg.type);
            }
        }
        
        function handleMessage(msg) {
            addLog('received', msg.type, msg.payload);
            
            if (msg.type === 'welcome') {
                clientId = msg.payload.clientId;
                addLog('system', `Tu ID: ${clientId}`);
            }
            
            if (msg.type === 'authenticated') {
                document.getElementById('clients').innerText = msg.payload.clientId ? '1' : '0';
            }
            
            // Actualizar estado
            fetchStatus();
        }
        
        function addLog(type, msg, payload = null) {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const time = new Date().toLocaleTimeString();
            let content = `<span class="time">[${time}]</span> <span class="type">${msg}</span>`;
            if (payload) {
                content += `<br><pre style="margin-top:5px;color:#888;font-size:11px">${JSON.stringify(payload, null, 2)}</pre>`;
            }
            
            entry.innerHTML = content;
            log.insertBefore(entry, log.firstChild);
        }
        
        function fetchStatus() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('clients').innerText = data.clients || 0;
                    document.getElementById('sessions').innerText = data.sessions || 0;
                    document.getElementById('uptime').innerText = Math.floor(data.uptime || 0) + 's';
                });
        }
        
        // Auto connect
        connect();
        
        // Actualizar estado cada 5 segundos
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
