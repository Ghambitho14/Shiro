<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PiClaw — Chat</title>
	<style>
		:root {
			--bg: #0f0f12;
			--surface: #1a1a1f;
			--border: #2a2a32;
			--text: #e4e4e7;
			--muted: #71717a;
			--accent: #a78bfa;
			--user-bg: #2e2a3e;
			--assistant-bg: #1e1e24;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: "Segoe UI", system-ui, sans-serif;
			background: var(--bg);
			color: var(--text);
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}
		header {
			padding: 0.75rem 1rem;
			border-bottom: 1px solid var(--border);
			display: flex;
			align-items: center;
			gap: 0.5rem;
		}
		header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
		header .muted { font-size: 0.8rem; color: var(--muted); }
		#messages {
			flex: 1;
			overflow-y: auto;
			padding: 1rem;
			display: flex;
			flex-direction: column;
			gap: 0.75rem;
		}
		.msg {
			max-width: 85%;
			padding: 0.75rem 1rem;
			border-radius: 12px;
			line-height: 1.5;
			white-space: pre-wrap;
			word-break: break-word;
		}
		.msg.user {
			align-self: flex-end;
			background: var(--user-bg);
			border: 1px solid var(--border);
		}
		.msg.assistant {
			align-self: flex-start;
			background: var(--assistant-bg);
			border: 1px solid var(--border);
		}
		.msg .role { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.25rem; }
		#form {
			padding: 1rem;
			border-top: 1px solid var(--border);
			display: flex;
			gap: 0.5rem;
		}
		#input {
			flex: 1;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 10px;
			color: var(--text);
			padding: 0.75rem 1rem;
			font-size: 1rem;
			resize: none;
			min-height: 44px;
			max-height: 160px;
		}
		#input:focus { outline: none; border-color: var(--accent); }
		#send {
			background: var(--accent);
			color: var(--bg);
			border: none;
			border-radius: 10px;
			padding: 0 1.25rem;
			font-weight: 600;
			cursor: pointer;
		}
		#send:hover { filter: brightness(1.1); }
		#send:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
		.error { color: #f87171; font-size: 0.9rem; padding: 0.5rem; }
	</style>
</head>
<body>
		<header>
		<h1 id="assistant-name">PiClaw</h1>
		<span class="muted">— Chat (vLLM)</span>
		<span class="muted" id="health-line" style="margin-left: auto; font-size: 0.75rem;"></span>
	</header>
	<div id="messages"></div>
	<form id="form">
		<textarea id="input" placeholder="Escribe un mensaje..." rows="1"></textarea>
		<button type="submit" id="send">Enviar</button>
	</form>
	<script>
		const messagesEl = document.getElementById("messages");
		const form = document.getElementById("form");
		const input = document.getElementById("input");
		const sendBtn = document.getElementById("send");
		const nameEl = document.getElementById("assistant-name");

		let assistantName = "PiClaw";
		let abilities = "";
		const messages = [];

		async function loadState() {
			try {
				const r = await fetch("/api/state");
				if (r.ok) {
					const d = await r.json();
					assistantName = d.name || "PiClaw";
					abilities = d.abilities || "";
					nameEl.textContent = assistantName;
				}
			} catch (_) {}
			try {
				const r = await fetch("/api/health");
				if (r.ok) {
					const d = await r.json();
					const el = document.getElementById("health-line");
					if (el && d.lastActive) {
						const t = new Date(d.lastActive);
						el.textContent = "Última actividad: " + t.toLocaleString();
					}
				}
			} catch (_) {}
		}

		function addMessage(role, content) {
			const div = document.createElement("div");
			div.className = "msg " + role;
			div.innerHTML = "<span class=\"role\">" + (role === "user" ? "Tú" : assistantName) + "</span><div>" + escapeHtml(content) + "</div>";
			messagesEl.appendChild(div);
			messagesEl.scrollTop = messagesEl.scrollHeight;
		}

		function escapeHtml(s) {
			const div = document.createElement("div");
			div.textContent = s;
			return div.innerHTML;
		}

		function setError(msg) {
			const prev = messagesEl.querySelector(".error");
			if (prev) prev.remove();
			const el = document.createElement("div");
			el.className = "error";
			el.textContent = msg;
			messagesEl.appendChild(el);
			messagesEl.scrollTop = messagesEl.scrollHeight;
		}

		form.addEventListener("submit", async (e) => {
			e.preventDefault();
			const text = (input.value || "").trim();
			if (!text) return;
			input.value = "";
			addMessage("user", text);
			messages.push({ role: "user", content: text });
			sendBtn.disabled = true;

			let systemContent = "Eres un asistente útil llamado " + assistantName + ". Responde en el mismo idioma que el usuario.";
			if (abilities) systemContent += "\n\nHabilidades o instrucciones: " + abilities;
			const apiMessages = [
				{ role: "system", content: systemContent },
				...messages
			];

			try {
				const r = await fetch("/api/chat", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ messages: apiMessages })
				});
				const data = await r.json();
				if (!r.ok) {
					setError(data.error || "Error " + r.status);
					sendBtn.disabled = false;
					return;
				}
				const content = data.content || "";
				addMessage("assistant", content);
				messages.push({ role: "assistant", content });
				loadState();
			} catch (err) {
				setError(err.message || "Error de conexión");
			}
			sendBtn.disabled = false;
		});

		loadState();
	</script>
</body>
</html>
